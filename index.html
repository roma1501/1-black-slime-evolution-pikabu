<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Чёрная слизь: эволюция</title>
    <link rel="icon" type="image/png" href="assets/ui/favicon.png">
    <style>
        /* Шрифты (OFL, есть кириллица): заголовки и крупные числа — Rubik Wet Paint (капающая краска), весь текст — Rubik Bubbles (пузырчатый). */
        @font-face {
            font-family: 'GH Wet Paint';
            src: url('assets/fonts/rubik-wet-paint.ttf?v=0.1.3-7b5f9928') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'GH Bubbles';
            src: url('assets/fonts/rubik-bubbles.ttf?v=0.1.3-7b5f9928') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        :root {
            --game-font: 'GH Bubbles', 'Rubik Bubbles', system-ui, sans-serif;
            --game-title-font: 'GH Wet Paint', 'Rubik Wet Paint', 'GH Bubbles', system-ui, sans-serif;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05050a;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        /* ---- loading screen: black slime, neon progress tube ---- */
        #loading-screen {
            --ld: #4de8ff;
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            gap: clamp(8px, 1.8vh, 16px);
            padding: 0 5% clamp(14px, 5vh, 44px);
            box-sizing: border-box;
            overflow: hidden;
            background: #05050a url('assets/ui/bg-loading.webp?v=0.1.3-7b5f9928') 35% 30% / cover no-repeat;
            font-family: var(--game-font);
            z-index: 1000;
        }
        #loading-screen::before, #loading-screen::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            pointer-events: none;
        }
        /* readability: dark vignette at the bottom (behind the liquid bar) and a faint one at the top */
        #loading-screen::before {
            top: 0;
            height: 14%;
            background: linear-gradient(180deg, rgba(5, 5, 10, .5), rgba(5, 5, 10, 0));
        }
        #loading-screen::after {
            bottom: 0;
            height: 62%;
            background: linear-gradient(0deg, rgba(5, 5, 10, .95) 10%, rgba(5, 5, 10, .6) 55%, rgba(5, 5, 10, 0));
        }
        #loading-screen > * { position: relative; z-index: 1; }
        .ld-logo {
            width: min(440px, 72vw, 46vh);
            height: auto;
            margin-top: auto;
            margin-bottom: -4px;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .7));
            pointer-events: none;
        }
        .ld-slime {
            display: none;
            position: relative;
            width: clamp(96px, 24vh, 190px);
            height: clamp(82px, 20vh, 160px);
            border-radius: 48% 52% 44% 56% / 62% 58% 42% 38%;
            background:
                radial-gradient(ellipse at 28% 20%, rgba(255, 255, 255, .6) 0 6%, transparent 20%),
                radial-gradient(ellipse at 50% 92%, #26263e, #07070d 72%);
            box-shadow: inset 0 0 22px rgba(77, 232, 255, .55), inset 0 -14px 20px rgba(0, 0, 0, .7), 0 0 44px rgba(77, 232, 255, .45);
            animation: ld-wob 1.8s ease-in-out infinite;
            transform-origin: 50% 100%;
        }
        .ld-slime i {
            position: absolute;
            top: 36%;
            width: 24%;
            height: 13%;
            border-radius: 50%;
            background: var(--ld);
            box-shadow: 0 0 10px var(--ld), 0 0 26px var(--ld);
            animation: ld-blink 3.4s infinite;
        }
        .ld-slime i:nth-child(1) { left: 20%; transform: rotate(14deg); }
        .ld-slime i:nth-child(2) { right: 20%; transform: rotate(-14deg); }
        .ld-slime b {
            position: absolute;
            left: 30%; right: 30%; bottom: 17%;
            height: 12%;
            border-radius: 0 0 40px 40px;
            background: repeating-linear-gradient(90deg, #f3f3ff 0 5px, transparent 5px 9px);
            border-bottom: 3px solid var(--ld);
        }
        @keyframes ld-wob { 0%, 100% { transform: scale(1, 1); } 40% { transform: scale(1.07, .93); } 70% { transform: scale(.96, 1.05) translateY(-4px); } }
        @keyframes ld-blink { 0%, 93%, 100% { opacity: 1; } 96% { opacity: .15; } }
        .loading-text {
            font-size: clamp(13px, 2vh, 16px);
            font-weight: 400;
            color: #dfe3ff;
            text-shadow: 0 2px 0 #000;
            text-align: center;
            min-height: 1em;
            letter-spacing: .03em;
        }
        .loading-bar {
            position: relative;
            width: min(380px, 78%);
            height: clamp(20px, 3.6vh, 28px);
            background: #030307;
            border: 3px solid #000;
            border-radius: 20px 24px 20px 26px / 24px 18px 26px 20px;
            overflow: hidden;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, .9), 0 0 0 2px rgba(77, 232, 255, .45), 0 0 26px rgba(77, 232, 255, .3);
        }
        /* liquid: wavy surface + rising bubbles (transform-only animations) */
        .loading-progress {
            position: relative;
            height: 100%;
            width: 0%;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 38%, rgba(0, 0, 0, .28)), linear-gradient(90deg, rgba(77, 232, 255, .8), #4de8ff);
            border-radius: 0 18px 18px 0;
            box-shadow: 0 0 14px rgba(77, 232, 255, .9);
            transition: width .3s cubic-bezier(.3, 1.5, .5, 1);
        }
        .loading-progress::before {
            content: '';
            position: absolute;
            left: 0; top: -1px;
            width: calc(100% + 40px);
            height: 9px;
            background: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 8' preserveAspectRatio='none'%3E%3Cpath d='M0 0H40V4Q30 9 20 4T0 4Z' fill='%23030307'/%3E%3C/svg%3E") 0 0 / 40px 100% repeat-x;
            animation: ld-wave 2s linear infinite;
        }
        .loading-progress::after {
            content: '';
            position: absolute;
            left: 0; right: 0; top: 0;
            height: 200%;
            background:
                radial-gradient(circle at 15% 78%, transparent 5px, rgba(255, 255, 255, .6) 6px 8px, transparent 9px),
                radial-gradient(circle at 45% 40%, transparent 3px, rgba(255, 255, 255, .6) 4px 5px, transparent 6px),
                radial-gradient(circle at 75% 88%, transparent 4px, rgba(255, 255, 255, .6) 5px 7px, transparent 8px),
                radial-gradient(circle at 92% 32%, transparent 6px, rgba(255, 255, 255, .6) 7px 9px, transparent 10px);
            background-size: 100% 50%;
            animation: ld-rise 4.5s linear infinite;
        }
        @keyframes ld-wave { to { transform: translateX(-40px); } }
        @keyframes ld-rise { to { transform: translateY(-50%); } }
        /* kept in the DOM for LoadingScreen.js and screen readers; the logo image is the visible title */
        #loading-title {
            position: absolute;
            width: 1px; height: 1px;
            margin: -1px; padding: 0;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }
        .ld-slime {
            display: none;
            position: relative;
            width: clamp(96px, 24vh, 190px);
            height: clamp(82px, 20vh, 160px);
            border-radius: 48% 52% 44% 56% / 62% 58% 42% 38%;
            background:
                radial-gradient(ellipse at 28% 20%, rgba(255, 255, 255, .6) 0 6%, transparent 20%),
                radial-gradient(ellipse at 50% 92%, #26263e, #07070d 72%);
            box-shadow: inset 0 0 22px rgba(77, 232, 255, .55), inset 0 -14px 20px rgba(0, 0, 0, .7), 0 0 44px rgba(77, 232, 255, .45);
            animation: ld-wob 1.8s ease-in-out infinite;

        }

        }
        .ld-slime i:nth-child(1) { left: 20%; transform: rotate(14deg); }
        .ld-slime i:nth-child(2) { right: 20%; transform: rotate(-14deg); }
        .ld-slime b {

        @keyframes ld-blink { 0%, 93%, 100% { opacity: 1; } 96% { opacity: .15; } }
        .loading-text {
            font-size: clamp(13px, 2vh, 16px);
            font-weight: 400;
            color: #aeb4d4;
            text-align: center;
            min-height: 1em;
            letter-spacing: .03em;
        }

        @keyframes ld-rise { to { transform: translateY(-50%); } }
        #loading-title {
            margin: 0;
            font: 400 clamp(26px, 7vmin, 60px)/1.05 var(--game-title-font);
            color: #fff;
            text-align: center;
            max-width: 92%;
            -webkit-text-stroke: .16em #05050a;
            paint-order: stroke fill;
            text-shadow: 0 .06em 0 #000, 0 0 .5em rgba(77, 232, 255, .65);
        }
        #loading-percent {
            font: 400 clamp(16px, 3.4vh, 26px) var(--game-font);
            color: #4de8ff;
            -webkit-text-stroke: .14em #05050a;
            paint-order: stroke fill;
            text-shadow: 0 0 .5em rgba(77, 232, 255, .8);
        }
        #loading-retry {
            padding: 12px 28px;
            border: 3px solid #000;
            border-radius: 20px 26px 20px 24px / 24px 18px 26px 20px;
            background: linear-gradient(180deg, #7aefff, #1596b8);
            color: #fff;
            font: 400 18px var(--game-font);
            -webkit-text-stroke: .12em #05050a;
            paint-order: stroke fill;
            box-shadow: inset 0 3px 0 rgba(255, 255, 255, .5), 0 5px 0 #000;
            cursor: pointer;
            transition: transform .2s cubic-bezier(.3, 2, .5, 1);
        }
        #loading-retry:active { transform: scale(.92); }
        #loading-retry[hidden] { display: none; }
    </style>
</head>
<body>
    <canvas id="world3d"></canvas>
    <div id="loading-screen" role="status" aria-busy="true" aria-live="polite">

    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
    </script>
